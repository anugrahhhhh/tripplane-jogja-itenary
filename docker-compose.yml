services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: php_base
    container_name: jogjatrip_app
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - storage_data:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jogjatrip

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx_server
    container_name: jogjatrip_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - storage_data:/var/www/html/storage/app/public:ro
    depends_on:
      - app
    networks:
      - jogjatrip

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: php_base
    container_name: jogjatrip_scheduler
    restart: unless-stopped
    entrypoint: []
    command: ["sh", "-c", "sleep 15 && php artisan schedule:work"]
    env_file:
      - .env.docker
    environment:
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - storage_data:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jogjatrip

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: php_base
    container_name: jogjatrip_queue
    restart: unless-stopped
    entrypoint: []
    command: ["sh", "-c", "sleep 15 && php artisan queue:work --tries=3 --backoff=30"]
    env_file:
      - .env.docker
    environment:
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - storage_data:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jogjatrip

  db:
    image: mysql:8.0
    container_name: jogjatrip_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: jogjatrip
      MYSQL_USER: jogjatrip
      MYSQL_PASSWORD: jogjatrip_secret
      MYSQL_ROOT_PASSWORD: jogjatrip_root_secret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pjogjatrip_root_secret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - jogjatrip

volumes:
  db_data:
  storage_data:

networks:
  jogjatrip:
    driver: bridge
