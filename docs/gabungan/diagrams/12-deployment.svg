<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="Diagram deployment JogjaTrip: perangkat klien terhubung ke web server Laragon lewat HTTP, web server terhubung ke database MySQL lewat TCP 3306, dan browser terhubung langsung ke CDN serta OpenStreetMap tile server">
  <style>
    .dg-relation{stroke:#2A3B35; fill:none;}
    .dg-line{stroke:#B9C3BC; fill:none;}
    .dg-text{fill:#2A3B35; font-family:'IBM Plex Sans', Arial, sans-serif;}
    .dg-text-accent{fill:#A85A72; font-family:'IBM Plex Mono', monospace;}
    .dg-arrowfill{fill:#2A3B35;}
    .dg-guest{fill:#EAF2EF; stroke:#2F6B5A;}
    .dg-external{fill:#F8EEF1; stroke:#A85A72; stroke-dasharray:6,4;}
  </style>
  <rect fill="#FFFFFF" x="0" y="0" width="1200" height="640"/>
  <defs>
    <marker id="darr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-arrowfill" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <g class="dg-relation" stroke-width="1.4">
    <line x1="336" y1="346" x2="460" y2="346" marker-end="url(#darr)" marker-start="url(#darr)"/>
    <line x1="776" y1="346" x2="900" y2="346" marker-end="url(#darr)" marker-start="url(#darr)"/>
    <line x1="190" y1="240" x2="190" y2="130" marker-end="url(#darr)"/>
    <line x1="190" y1="436" x2="190" y2="500" marker-end="url(#darr)"/>
  </g>
  <g class="dg-text" font-family="IBM Plex Mono, monospace" font-size="10.5">
    <text x="398" y="335" text-anchor="middle">HTTP/HTTPS :8000</text>
    <text x="398" y="365" text-anchor="middle">Blade views + JSON API</text>
    <text x="838" y="335" text-anchor="middle">TCP :3306</text>
    <text x="838" y="365" text-anchor="middle">Eloquent ORM (PDO MySQL)</text>
    <text x="210" y="185" text-anchor="start">HTTPS — muat Tailwind,</text>
    <text x="210" y="198" text-anchor="start">Alpine.js, Leaflet.js</text>
    <text x="210" y="472" text-anchor="start">HTTPS — ambil</text>
    <text x="210" y="485" text-anchor="start">ubin (tile) peta</text>
  </g>

  <rect class="dg-external" x="60" y="30" width="260" height="100" rx="8" stroke-width="1.4"/>
  <text class="dg-text-accent" x="190" y="52" text-anchor="middle" font-size="10">«external service»</text>
  <text class="dg-text" x="190" y="72" text-anchor="middle" font-size="13" font-weight="700">CDN (cdnjs)</text>
  <text class="dg-text" x="190" y="94" text-anchor="middle" font-size="11">Tailwind CSS &#183; Alpine.js</text>
  <text class="dg-text" x="190" y="110" text-anchor="middle" font-size="11">Leaflet.js</text>

  <rect class="dg-external" x="60" y="500" width="260" height="100" rx="8" stroke-width="1.4"/>
  <text class="dg-text-accent" x="190" y="522" text-anchor="middle" font-size="10">«external service»</text>
  <text class="dg-text" x="190" y="542" text-anchor="middle" font-size="13" font-weight="700">OpenStreetMap</text>
  <text class="dg-text" x="190" y="562" text-anchor="middle" font-size="11">Tile Server</text>
  <text class="dg-text" x="190" y="580" text-anchor="middle" font-size="11">(peta gratis, tanpa API key)</text>

  <g class="dg-guest" stroke-width="1.4">
    <polygon points="60,256 76,240 336,240 320,256"/>
    <polygon points="320,256 336,240 336,420 320,436"/>
    <rect x="60" y="256" width="260" height="180"/>
  </g>
  <text class="dg-text" x="80" y="280" font-size="10" font-family="IBM Plex Mono, monospace">«device»</text>
  <text class="dg-text" x="80" y="300" font-size="13.5" font-weight="700">Perangkat Klien</text>
  <line class="dg-line" x1="80" y1="310" x2="300" y2="310" stroke-width="1"/>
  <text class="dg-text" x="80" y="330" font-size="11">Browser (Chrome/Edge/Firefox)</text>
  <text class="dg-text" x="80" y="350" font-size="11">Blade-rendered HTML + Tailwind</text>
  <text class="dg-text" x="80" y="370" font-size="11">Alpine.js — interaktivitas UI</text>
  <text class="dg-text" x="80" y="390" font-size="11">Leaflet.js — render peta</text>
  <text class="dg-text" x="80" y="410" font-size="11">fetch() — panggilan JSON API</text>

  <g class="dg-guest" stroke-width="1.4">
    <polygon points="460,236 476,220 776,220 760,236"/>
    <polygon points="760,236 776,220 776,440 760,456"/>
    <rect x="460" y="236" width="300" height="220"/>
  </g>
  <text class="dg-text" x="480" y="260" font-size="10" font-family="IBM Plex Mono, monospace">«execution environment»</text>
  <text class="dg-text" x="480" y="280" font-size="13.5" font-weight="700">Web Server (Laragon)</text>
  <line class="dg-line" x1="480" y1="290" x2="740" y2="290" stroke-width="1"/>
  <text class="dg-text" x="480" y="310" font-size="11">Apache/Nginx + PHP 8.2 (PHP-FPM)</text>
  <text class="dg-text" x="480" y="330" font-size="11" font-weight="600">Aplikasi Laravel 12</text>
  <text class="dg-text" x="490" y="348" font-size="10.5">Controllers &#183; Services &#183; Blade Views</text>
  <text class="dg-text" x="480" y="368" font-size="11">barryvdh/laravel-dompdf</text>
  <text class="dg-text" x="480" y="388" font-size="11">storage/app/public</text>
  <text class="dg-text" x="490" y="404" font-size="10.5">(foto destinasi, symlink public/storage)</text>

  <g class="dg-guest" stroke-width="1.4">
    <polygon points="900,266 916,250 1140,250 1124,266"/>
    <polygon points="1124,266 1140,250 1140,410 1124,426"/>
    <rect x="900" y="266" width="224" height="160"/>
  </g>
  <text class="dg-text" x="918" y="290" font-size="10" font-family="IBM Plex Mono, monospace">«device»</text>
  <text class="dg-text" x="918" y="310" font-size="13.5" font-weight="700">Database Server</text>
  <line class="dg-line" x1="918" y1="320" x2="1106" y2="320" stroke-width="1"/>
  <text class="dg-text" x="918" y="342" font-size="11">MySQL 8.0</text>
  <text class="dg-text" x="918" y="362" font-size="11">Database: jogjatrip</text>
  <text class="dg-text" x="918" y="382" font-size="11">7 kategori &#183; 35 destinasi (seeder)</text>
</svg>
