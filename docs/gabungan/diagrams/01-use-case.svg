<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" role="img" aria-label="Diagram use case JogjaTrip dengan tiga aktor: Pengunjung, Traveler yang mewarisi Pengunjung, dan Admin, masing-masing terhubung ke use case di dalam batas sistem JogjaTrip">
  <style>
    .dg-boundary{fill:none; stroke:#2A3B35;}
    .dg-line{stroke:#B9C3BC; fill:none;}
    .dg-relation{stroke:#2A3B35; fill:none;}
    .dg-actor{fill:#FFFFFF; stroke:#2A3B35;}
    .dg-text{fill:#2A3B35; font-family:'IBM Plex Sans', Arial, sans-serif;}
    .dg-arrowfill{fill:#2A3B35;}
    .dg-genfill{fill:#FFFFFF; stroke:#2A3B35;}
    .dg-guest{fill:#EAF2EF; stroke:#2F6B5A;}
    .dg-traveler{fill:#F5F3EC; stroke:#1F483D;}
    .dg-admin{fill:#F8EEF1; stroke:#A85A72;}
  </style>
  <rect fill="#FFFFFF" x="0" y="0" width="1400" height="600"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="dg-arrowfill" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrowGen" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path class="dg-genfill" d="M1,1 L11,6 L1,11 z" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="dg-boundary" x="215" y="45" width="970" height="510" rx="14" stroke-width="1.6"/>
  <text class="dg-text" x="700" y="72" text-anchor="middle" font-size="15" font-weight="700">Sistem JogjaTrip</text>

  <g class="dg-line" stroke-width="1.3">
    <line x1="90" y1="180" x2="340" y2="135"/>
    <line x1="90" y1="180" x2="580" y2="135"/>
    <line x1="90" y1="180" x2="820" y2="135"/>
    <line x1="90" y1="180" x2="1060" y2="135"/>
    <line x1="90" y1="180" x2="340" y2="225"/>
    <line x1="90" y1="180" x2="580" y2="225"/>
    <line x1="90" y1="320" x2="820" y2="225"/>
    <line x1="90" y1="320" x2="1060" y2="225"/>
    <line x1="90" y1="320" x2="580" y2="315"/>
    <line x1="90" y1="320" x2="1060" y2="315"/>
    <line x1="90" y1="320" x2="340" y2="405"/>
    <line x1="90" y1="320" x2="580" y2="405"/>
    <line x1="1310" y1="460" x2="580" y2="225"/>
    <line x1="1310" y1="460" x2="820" y2="405"/>
    <line x1="1310" y1="460" x2="1060" y2="405"/>
    <line x1="1310" y1="460" x2="340" y2="495"/>
    <line x1="1310" y1="460" x2="580" y2="495"/>
    <line x1="1310" y1="460" x2="820" y2="495"/>
  </g>

  <line class="dg-relation" x1="90" y1="306" x2="90" y2="216" stroke-width="1.6" marker-end="url(#arrowGen)"/>
  <text class="dg-text" x="132" y="264" font-size="11" font-style="italic">generalisasi</text>

  <line class="dg-relation" x1="500" y1="315" x2="420" y2="315" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text class="dg-text" x="460" y="300" text-anchor="middle" font-size="10.5" font-family="IBM Plex Mono, monospace">«include»</text>

  <line class="dg-relation" x1="740" y1="315" x2="660" y2="315" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text class="dg-text" x="700" y="300" text-anchor="middle" font-size="10.5" font-family="IBM Plex Mono, monospace">«extend»</text>

  <g class="dg-actor" stroke-width="1.8" stroke-linecap="round">
    <circle cx="90" cy="146" r="12"/>
    <line x1="90" y1="158" x2="90" y2="190"/>
    <line x1="74" y1="170" x2="106" y2="170"/>
    <line x1="90" y1="190" x2="76" y2="214"/>
    <line x1="90" y1="190" x2="104" y2="214"/>
  </g>
  <text class="dg-text" x="90" y="232" text-anchor="middle" font-size="12.5" font-weight="600">Pengunjung</text>

  <g class="dg-actor" stroke-width="1.8" stroke-linecap="round">
    <circle cx="90" cy="286" r="12"/>
    <line x1="90" y1="298" x2="90" y2="330"/>
    <line x1="74" y1="310" x2="106" y2="310"/>
    <line x1="90" y1="330" x2="76" y2="354"/>
    <line x1="90" y1="330" x2="104" y2="354"/>
  </g>
  <text class="dg-text" x="90" y="372" text-anchor="middle" font-size="12.5" font-weight="600">Traveler</text>

  <g class="dg-actor" stroke-width="1.8" stroke-linecap="round">
    <circle cx="1310" cy="426" r="12"/>
    <line x1="1310" y1="438" x2="1310" y2="470"/>
    <line x1="1294" y1="450" x2="1326" y2="450"/>
    <line x1="1310" y1="470" x2="1296" y2="494"/>
    <line x1="1310" y1="470" x2="1324" y2="494"/>
  </g>
  <text class="dg-text" x="1310" y="512" text-anchor="middle" font-size="12.5" font-weight="600">Admin</text>

  <g class="dg-guest" font-size="12.5" text-anchor="middle" stroke-width="1.4">
    <ellipse cx="340" cy="135" rx="98" ry="32"/>
    <text class="dg-text" x="340" y="140">Melihat Beranda</text>

    <ellipse cx="580" cy="135" rx="98" ry="32"/>
    <text class="dg-text" x="580" y="132">Cari &amp; Filter</text>
    <text class="dg-text" x="580" y="148">Destinasi</text>

    <ellipse cx="820" cy="135" rx="98" ry="32"/>
    <text class="dg-text" x="820" y="140">Detail Destinasi</text>

    <ellipse cx="1060" cy="135" rx="98" ry="32"/>
    <text class="dg-text" x="1060" y="132">Rekomendasi</text>
    <text class="dg-text" x="1060" y="148">Terdekat</text>

    <ellipse cx="340" cy="225" rx="98" ry="32"/>
    <text class="dg-text" x="340" y="230">Mendaftar Akun</text>

    <ellipse cx="580" cy="225" rx="98" ry="32"/>
    <text class="dg-text" x="580" y="230">Login</text>
  </g>

  <g class="dg-traveler" font-size="12.5" text-anchor="middle" stroke-width="1.4">
    <ellipse cx="820" cy="225" rx="98" ry="32"/>
    <text class="dg-text" x="820" y="230">Kelola Favorit</text>

    <ellipse cx="1060" cy="225" rx="98" ry="32"/>
    <text class="dg-text" x="1060" y="230">Tulis Ulasan</text>

    <ellipse cx="340" cy="315" rx="98" ry="32"/>
    <text class="dg-text" x="340" y="312">Tambah Destinasi</text>
    <text class="dg-text" x="340" y="328">ke Itinerary</text>

    <ellipse cx="580" cy="315" rx="98" ry="32"/>
    <text class="dg-text" x="580" y="320">Kelola Itinerary</text>

    <ellipse cx="820" cy="315" rx="98" ry="32"/>
    <text class="dg-text" x="820" y="320">Urutkan Otomatis</text>

    <ellipse cx="1060" cy="315" rx="98" ry="32"/>
    <text class="dg-text" x="1060" y="312">Itinerary</text>
    <text class="dg-text" x="1060" y="328">Hari Ini</text>

    <ellipse cx="340" cy="405" rx="98" ry="32"/>
    <text class="dg-text" x="340" y="402">Unduh PDF</text>
    <text class="dg-text" x="340" y="418">Itinerary</text>

    <ellipse cx="580" cy="405" rx="98" ry="32"/>
    <text class="dg-text" x="580" y="410">Kelola Profil</text>
  </g>

  <g class="dg-admin" font-size="12.5" text-anchor="middle" stroke-width="1.4">
    <ellipse cx="820" cy="405" rx="98" ry="32"/>
    <text class="dg-text" x="820" y="410">Kelola Kategori</text>

    <ellipse cx="1060" cy="405" rx="98" ry="32"/>
    <text class="dg-text" x="1060" y="410">Kelola Destinasi</text>

    <ellipse cx="340" cy="495" rx="98" ry="32"/>
    <text class="dg-text" x="340" y="500">Moderasi Ulasan</text>

    <ellipse cx="580" cy="495" rx="98" ry="32"/>
    <text class="dg-text" x="580" y="500">Data Pengguna</text>

    <ellipse cx="820" cy="495" rx="98" ry="32"/>
    <text class="dg-text" x="820" y="493">Dashboard</text>
    <text class="dg-text" x="820" y="509">Statistik</text>
  </g>
</svg>
